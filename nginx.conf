worker_processes 1;

events {
    worker_connections 1024;
}

http {
    lua_package_path "/usr/local/openresty/lua/?.lua;/usr/local/openresty/lualib/?.lua;;";
    lua_shared_dict weights_cache 10m;
    lua_shared_dict metrics_cache 10m;

    # Initialize weights and metrics on startup
    init_worker_by_lua_block {
        local weights = ngx.shared.weights_cache
        weights:set("aws_wi", 33)
        weights:set("aks_wi", 33)
        weights:set("do_wi", 34)

        local metrics = ngx.shared.metrics_cache
        metrics:set("exec_requests_total_aws", 0)
        metrics:set("exec_requests_total_aks", 0)
        metrics:set("exec_requests_total_do", 0)
    }

    upstream aws_backend {
        server aws-simulator:8001;
    }

    upstream aks_backend {
        server aks-simulator:8002;
    }

    upstream do_backend {
        server digitalocean-simulator:8003;
    }

    server {
        listen 9000;

        location / {
            access_by_lua_block {
                local target = ngx.req.get_headers()["X-CSP-Target"]
                local metrics = ngx.shared.metrics_cache

                if target == "aws" then
                    ngx.var.backend = "aws_backend"
                    metrics:incr("exec_requests_total_aws", 1, 0)
                elseif target == "aks" then
                    ngx.var.backend = "aks_backend"
                    metrics:incr("exec_requests_total_aks", 1, 0)
                elseif target == "do" or target == "digitalocean" then
                    ngx.var.backend = "do_backend"
                    metrics:incr("exec_requests_total_do", 1, 0)
                else
                    -- Fallback to old behavior or default if header missing
                    ngx.var.backend = "aws_backend"
                    metrics:incr("exec_requests_total_aws", 1, 0)
                end
            }

            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /update_weights {
            content_by_lua_block {
                local weights_updater = require "weights_updater"
                weights_updater.update()
            }
        }

        location /metrics {
            default_type 'text/plain';
            content_by_lua_block {
                local metrics = ngx.shared.metrics_cache
                local aws_reqs = metrics:get("exec_requests_total_aws") or 0
                local aks_reqs = metrics:get("exec_requests_total_aks") or 0
                local do_reqs = metrics:get("exec_requests_total_do") or 0

                local response = "# HELP exec_requests_total Total requests routed to CSP\n" ..
                                 "# TYPE exec_requests_total counter\n" ..
                                 "exec_requests_total{csp=\"aws\"} " .. aws_reqs .. "\n" ..
                                 "exec_requests_total{csp=\"aks\"} " .. aks_reqs .. "\n" ..
                                 "exec_requests_total{csp=\"do\"} " .. do_reqs .. "\n" ..
                                 "# HELP csp_up CSP mock upstream health status\n" ..
                                 "# TYPE csp_up gauge\n" ..
                                 "csp_up{csp=\"aws\"} 1\n" ..
                                 "csp_up{csp=\"aks\"} 1\n" ..
                                 "csp_up{csp=\"do\"} 1\n"

                ngx.say(response)
            }
        }

        location /health {
            default_type 'application/json';
            access_by_lua_block {
                ngx.say('{"status":"ok"}')
            }
        }
    }
}