networks:
  app-network:
    driver: bridge

services:
  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper_1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - app-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 30s

  # Redis
  redis:
    image: redis:7
    container_name: redis_1
    ports:
      - "6379:6379"
    networks:
      - app-network

  # MongoDB
  mongo:
    image: mongo:7
    container_name: mongo_1
    ports:
      - "27017:27017"
    environment:
      - MONGO_URI=mongodb://mongo:27017/
    networks:
      - app-network

  # Mock Services - AWS
  aws-simulator:
    build:
      context: .
      dockerfile: mocks/Dockerfile
    container_name: aws-simulator
    command: python -m mocks.aws_simulator
    environment:
      SERVICE_PORT: "8001"
    ports:
      - "8001:8001"
    networks:
      - app-network

  # Mock Services - AKS
  aks-simulator:
    build:
      context: .
      dockerfile: mocks/Dockerfile
    container_name: aks-simulator
    command: python -m mocks.aks_simulator
    environment:
      SERVICE_PORT: "8002"
    ports:
      - "8002:8002"
    networks:
      - app-network

  # Mock Services - DigitalOcean
  digitalocean-simulator:
    build:
      context: .
      dockerfile: mocks/Dockerfile
    container_name: digitalocean-simulator
    command: python -m mocks.dodroplets_simulator
    environment:
      SERVICE_PORT: "8003"
    ports:
      - "8003:8003"
    networks:
      - app-network

  # Load Balancer Proxy
  load-balancer-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: load-balancer-proxy
    ports:
      - "9000:9000"
    depends_on:
      - kafka
      - aws-simulator
      - aks-simulator
      - digitalocean-simulator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AWS_ENDPOINT: http://aws-simulator:8001
      AKS_ENDPOINT: http://aks-simulator:8002
      DO_ENDPOINT: http://digitalocean-simulator:8003
    networks:
      - app-network

  # Execution Consumer
  execution-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: execution-consumer
    command: python -m runners.execution_consumer
    depends_on:
      - kafka
      - load-balancer-proxy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - app-network

  # Decision Producer
  decision-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: decision-producer
    command: python -m runners.decision_producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - app-network

  # Traffic Generator
  traffic-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-generator
    command: python -m runners.traffic_generator
    depends_on:
      - load-balancer-proxy
    environment:
      PROXY_URL: "http://load-balancer-proxy:9000"
      REQUESTS_PER_SECOND: "2"
      TARGET_PATH: "/"
    networks:
      - app-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-network
    depends_on:
      - aws-simulator
      - aks-simulator
      - digitalocean-simulator

  # Prometheus Metrics Adapter - Bridges Prometheus to Kafka
  prometheus-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prometheus-adapter

    environment:
      PROMETHEUS_AWS_URL: "http://aws-simulator:8001/metrics"
      PROMETHEUS_AKS_URL: "http://aks-simulator:8002/metrics"
      PROMETHEUS_DO_URL: "http://digitalocean-simulator:8003/metrics"

    networks:
      - app-network

  service-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-agent
    command: python runners/service_agent_runner.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SERVICE_ID: "service-cache-aws"
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  service-agent-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-agent-2
    command: python runners/service_agent_runner.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SERVICE_ID: "service-db"
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  service-agent-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-agent-3
    command: python runners/service_agent_runner.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SERVICE_ID: "service-cache"
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter
    container_name: kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped