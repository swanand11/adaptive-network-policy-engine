# NGINX Configuration for Multi-Cloud Load Balancer
# Dynamic weight-based traffic distribution using Lua and Redis

worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Lua shared dictionary for caching weights
    lua_shared_dict weights_cache 10m;
    
    # Lua package path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Upstream definitions
    upstream aws {
        server localhost:8001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream azure {
        server localhost:8002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream digitalocean {
        server localhost:8003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main load balancer server
    server {
        listen 9000;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Status endpoint
        location /status {
            access_log off;
            content_by_lua_block {
                local cjson = require "cjson"
                local weights_cache = ngx.shared.weights_cache
                
                local aws_weight = weights_cache:get("aws") or 33
                local azure_weight = weights_cache:get("azure") or 33
                local do_weight = weights_cache:get("digitalocean") or 34
                
                local status = {
                    status = "ok",
                    weights = {
                        aws = aws_weight,
                        azure = azure_weight,
                        digitalocean = do_weight
                    },
                    timestamp = ngx.now()
                }
                
                ngx.header.content_type = "application/json"
                ngx.say(cjson.encode(status))
            }
        }

        # Main proxy location with dynamic routing
        location / {
            set $backend "aws"; # Default placeholder, overwritten by Lua
            # Update weights from Redis periodically
            access_by_lua_file /etc/nginx/lua/balancer.lua;
            
            # Proxy settings
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # The actual proxy_pass is set by Lua
            proxy_pass http://$backend;
        }
    }

    # Background weight updater (runs every 5 seconds)
    init_worker_by_lua_block {
        local function update_weights()
            while true do
                ngx.sleep(5)  -- Update every 5 seconds
                
                local ok, err = pcall(function()
                    local redis = require "resty.redis"
                    local cjson = require "cjson"
                    local weights_cache = ngx.shared.weights_cache
                    
                    local red = redis:new()
                    red:set_timeout(1000)  -- 1 second timeout
                    
                    local ok, err = red:connect("127.0.0.1", 6379)
                    if not ok then
                        ngx.log(ngx.ERR, "Failed to connect to Redis: ", err)
                        return
                    end
                    
                    local weights_str, err = red:get("nginx:weights")
                    if not weights_str or weights_str == ngx.null then
                        ngx.log(ngx.WARN, "No weights found in Redis, using defaults")
                        return
                    end
                    
                    local weights_data = cjson.decode(weights_str)
                    local upstreams = weights_data.upstreams or {}
                    
                    -- Update shared dict
                    weights_cache:set("aws", upstreams.aws or 33)
                    weights_cache:set("azure", upstreams.azure or 33)
                    weights_cache:set("digitalocean", upstreams.digitalocean or 34)
                    weights_cache:set("last_update", ngx.now())
                    
                    ngx.log(ngx.INFO, "Updated weights: aws=", upstreams.aws, 
                            " azure=", upstreams.azure, 
                            " digitalocean=", upstreams.digitalocean)
                    
                    red:close()
                end)
                
                if not ok then
                    ngx.log(ngx.ERR, "Error updating weights: ", err)
                end
            end
        end
        
        -- Start background updater
        ngx.timer.at(0, function()
            update_weights()
        end)
    }
}
